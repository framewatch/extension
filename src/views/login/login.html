<div id="auth-app-content">
    <div class="header">
        <div class="header-center">
            <h3>My App Login</h3>
        </div>
        <div class="header-right">
            <button id="close-btn-login" class="btn-secondary">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 11L11 1" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M1 1L11 11" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="logged-out-view">
        <p>Login to continue.</p>
        <div class="form-field">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="user@example.com">
        </div>
        <div class="form-field">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" placeholder="••••••••">
        </div>
        <button id="login-btn" class="btn-primary">Login</button>
        <p id="error-message" class="error"></p>
    </div>
</div>
