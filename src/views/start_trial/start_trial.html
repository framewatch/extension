<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start Free Trial</title>
</head>
<body>
<div id="auth-app-content">
    <div class="header">
         <div class="header-left">
            <button id="logout-btn-trial" class="btn-secondary">Logout</button>
        </div>
        <div class="header-center">
            <h3 id="welcome-message-trial">Welcome!</h3>
        </div>
        <div class="header-right">
            <button id="close-btn-trial" class="btn-secondary">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 11L11 1" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M1 1L11 11" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="content-body">
        <p>You're one step away from boosting your sales. Start your 7-day free trial to get access to all features.</p>
        <p class="small-text">No credit card required.</p>
        <button id="start-trial-btn" class="btn-primary">Start 7-Day Free Trial</button>
        <p id="trial-message-box" class="feedback" style="display: none;"></p>
    </div>
</div>
</body>
</html>
