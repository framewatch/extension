<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>
</head>
<body>
<div id="auth-app-content">
    <div class="header">
        <div class="header-left">
             <button id="logout-btn-email" class="btn-secondary">Logout</button>
        </div>
        <div class="header-center">
            <h3>Verify Your Email</h3>
        </div>
        <div class="header-right">
            <button id="close-btn-verify-email" class="btn-secondary">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 11L11 1" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M1 1L11 11" stroke="#595959" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="content-body">
        <p>We've sent a verification link to <strong id="user-email-display">your email</strong>. Please check your inbox.</p>
        <button id="check-verification-btn" class="btn-primary">I've Verified My Email</button>
        <p id="email-message-box" class="feedback" style="display: none;"></p>
        <p class="small-text">Didn't receive it? <a href="#" id="resend-email-link">Send again</a>.</p>
    </div>
</div>
</body>
</html>
