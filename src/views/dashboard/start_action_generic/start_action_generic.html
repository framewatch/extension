<style>
    .form-section { margin-bottom: 20px; }
    .target-type-group { display: flex; gap: 20px; margin-bottom: 15px; }
</style>
<div id="start-action-generic-view">
    <div class="header">
        <button id="back-to-main-btn" class="btn-secondary" style="width: auto; padding: 5px 10px;">
            <svg class="icon-arrow is-left" width="14" height="12" viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 6.75C13.4142 6.75 13.75 6.41421 13.75 6C13.75 5.58579 13.4142 5.25 13 5.25V6.75ZM0.46967 5.46967C0.176777 5.76256 0.176777 6.23744 0.46967 6.53033L5.24264 11.3033C5.53553 11.5962 6.01041 11.5962 6.3033 11.3033C6.59619 11.0104 6.59619 10.5355 6.3033 10.2426L2.06066 6L6.3033 1.75736C6.59619 1.46447 6.59619 0.989592 6.3033 0.696699C6.01041 0.403806 5.53553 0.403806 5.24264 0.696699L0.46967 5.46967ZM13 6V5.25L1 5.25V6V6.75L13 6.75V6Z"/></svg>
             Back</button>
        <h4 id="action-title" style="margin: 0 auto;">Configure Action</h4>
    </div>

    <div style="padding-top: 15px;">
        <div class="form-section">
            <label id="target-by-label">Target By</label>
            <div class="target-type-group">
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="target_type" value="user" checked> User
                </label>
                <label style="display: flex; align-items: center; gap: 5px;">
                    <input type="radio" name="target_type" value="keyword"> Keyword
                </label>
            </div>
        </div>

        <div class="form-section">
            <label id="target-input-label" for="target-input">Username</label>
            <input type="text" id="target-input" placeholder="Enter username...">
        </div>

        <div class="form-section">
            <label for="quantity-input">Quantity</label>
            <input type="number" id="quantity-input" value="25" min="1" max="100">
            <p class="small-text" style="margin-top: 5px;">For safety, keep this under 100.</p>
        </div>
        
        <p id="generic-action-error" class="feedback error" style="display: none; margin-top: -10px; margin-bottom: 15px;"></p>

        <button id="start-generic-action-btn" class="btn-primary">Start</button>
    </div>
</div>
